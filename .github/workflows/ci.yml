name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Compile SCSS
        run: npm run build:css

      - name: Verify output files exist
        run: |
          test -f dist/index.html && echo "HTML OK"
          test -f dist/style.css && echo "CSS OK"
